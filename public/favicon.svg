<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    path{fill:none;stroke:#111;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme: dark){path{stroke:#f2f2f2}}
  </style>
  <!-- glass: a single pen line that wobbles a little and overshoots where it meets -->
  <path stroke-width="3.2" d="M25.4 45.6c-.2-4.4-2.3-6.9-4.9-10.1-2.6-3.2-4.2-6.6-4-10.9.4-8.6 7.2-14.9 15.9-14.6 9.1.3 15.6 7.6 15.2 16.2-.2 4.1-1.9 7-4.6 10.2-2.3 2.7-3.9 5.1-4.1 9.2-4.6.8-9.4.7-14.1-.2-.6-.1-1-.6-.9-1.1"/>
  <!-- highlight on the glass -->
  <path stroke-width="2.4" d="M23.3 22.4c.9-3.7 3.5-6.4 7.1-7.3"/>
  <!-- screw base, three uneven strokes -->
  <path stroke-width="3" d="M25.6 50.4c4.4.8 9 .7 13.4-.3"/>
  <path stroke-width="3" d="M26.9 54.8c3.6.6 7.2.5 10.6-.2"/>
  <path stroke-width="3" d="M29.6 58.9c1.8.4 3.5.3 5.1-.1"/>
  <!-- filament -->
  <path stroke-width="2.3" d="M28.9 45.2l-1.6-12.6c1.5 2.1 3 2.2 4.6.1 1.3 2.2 2.9 2.3 4.5.1l-1.1 12.4"/>
  <!-- small rays -->
  <path stroke-width="2.6" d="M32.6 4.2l-.2 2.6"/>
  <path stroke-width="2.6" d="M51.6 11.8l-2 1.7"/>
  <path stroke-width="2.6" d="M12.8 11.2l2.1 1.9"/>
</svg>
